function InputField({ label, value, onChange, onKeyDown, placeholder, type = "text", maxLength }) {

function CoachIA() {
  const [sessionId] = useState(() =>
    (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`)
  );
  const [lang, setLang] = useState(detectLang);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  // phases: welcome → complaints → score → result → testimonials → country → cta → chat
  const [phase, setPhase] = useState("welcome");
  const [nameInput, setNameInput] = useState("");
  const [ageInput, setAgeInput] = useState("");
  const [emailInput, setEmailInput] = useState("");
  const [consentGdpr, setConsentGdpr] = useState(false);
  const [selectedComplaints, setSelectedComplaints] = useState([]);
  const [country, setCountry] = useState("");
  const [scoreAnswers, setScoreAnswers] = useState({});
  const [currentQ, setCurrentQ] = useState(0);
  const [totalScore, setTotalScore] = useState(0);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);

  const L = LANGS[lang];

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, loading]);

  useEffect(() => {
    if (phase === "chat") inputRef.current?.focus();
  }, [phase]);

  const canStart = nameInput.trim() && ageInput.trim() && emailInput.trim().includes("@") && consentGdpr;
  const canProceedComplaints = selectedComplaints.length > 0;

  const startFlow = () => {
    saveLead({
      session_id: sessionId,
      stage: "started",
      name: nameInput.trim(),
      age: ageInput.trim(),
      country: country,
      email: emailInput.trim(),
      lang: lang,
    });
    setPhase("complaints");
  };

  const toggleComplaint = (opt) => {
    setSelectedComplaints(prev =>
      prev.find(c => c.label === opt.label)
        ? prev.filter(c => c.label !== opt.label)
        : [...prev, opt]
    );
  };

  const allSelectedKeywords = [...new Set(selectedComplaints.flatMap(c => c.keywords))];
  const complaintsLabel = selectedComplaints.map(c => c.label).join(", ");
  const complaintsLabelLang = selectedComplaints
    .map(c => {
      const match = L.complaintOptions.find(o =>
        o.keywords.some(k => c.keywords && c.keywords.includes(k))
      );
      return match ? match.label : c.label;
    })
    .join(", ");

  const handleScoreAnswer = (questionId, value) => {
    const updated = { ...scoreAnswers, [questionId]: value };
    setScoreAnswers(updated);
    if (currentQ < L.scoreQuestions.length - 1) {
      setCurrentQ(currentQ + 1);
    } else {
      const total = Object.values(updated).reduce((a, b) => a + b, 0);
      setTotalScore(total);
      const level = L.getScoreLevel(total);
      saveLead({
        session_id: sessionId,
        stage: "score_completed",
        name: nameInput.trim(),
        age: ageInput.trim(),
        country: country,
        email: emailInput.trim(),
        complaints: complaintsLabel,
        score: total,
        level: level.label,
        lang: lang,
      });
      setPhase("result");
    }
  };

  const startChat = async () => {
    setPhase("chat");
    setLoading(true);
    const level = L.getScoreLevel(totalScore);
    saveLead({
      session_id: sessionId,
      stage: "chat_started",
      name: nameInput.trim(),
      email: emailInput.trim(),
      score: totalScore,
      level: level.label,
      lang: lang,
    });
    const initMsg = lang === 'pt'
      ? `O meu nome é ${nameInput.trim()}, tenho ${ageInput.trim()} anos e estou em ${country}. Os meus problemas respiratórios principais são: ${complaintsLabel}. O meu Score de Stress Oxidativo é ${totalScore}/40 — nível: ${level.label}.`
      : `My name is ${nameInput.trim()}, I am ${ageInput.trim()} years old and I am in ${country}. My main respiratory problems are: ${complaintsLabel}. My Oxidative Stress Score is ${totalScore}/40 — level: ${level.label}.`;
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/chat-proxy`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({
          max_tokens: 1000,
          system: L.systemPrompt,
          messages: [{ role: "user", content: initMsg }],
        }),
      });
      const data = await res.json();
      const fallback = lang === 'pt' ? `Olá ${nameInput.trim()}! Como posso ajudar?` : `Hello ${nameInput.trim()}! How can I help?`;
      const reply = data.content?.find(b => b.type === 'text')?.text
        || (data.error ? `[DEBUG] ${JSON.stringify(data.error)}` : fallback);
      setMessages([
        { role: "user", content: initMsg, hidden: true },
        { role: "assistant", content: reply },
      ]);
    } catch (e) {
      const errMsg = lang === 'pt' ? "Erro ao iniciar. Tenta novamente." : "Error starting. Please try again.";
      setMessages([{ role: "assistant", content: `${errMsg} [DEBUG] ${e && e.message ? e.message : String(e)}` }]);
    }
    setLoading(false);
  };

  const sendMessage = async () => {
    if (!input.trim() || loading) return;
    const userMsg = input.trim();
    setInput("");
    const newMessages = [...messages, { role: "user", content: userMsg }];
    setMessages(newMessages);
    setLoading(true);
    const apiMessages = newMessages.map(m => ({ role: m.role, content: m.content }));
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/chat-proxy`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({
          max_tokens: 1000,
          system: L.systemPrompt,
          messages: apiMessages,
        }),
      });
      const data = await res.json();
      const errReply = lang === 'pt' ? "Não consegui responder. Tenta novamente." : "Could not respond. Please try again.";
      const reply = data.content?.find(b => b.type === 'text')?.text
        || `${errReply} [DEBUG] status=${res.status} ${JSON.stringify(data)}`;
      setMessages(prev => [...prev, { role: "assistant", content: reply }]);
    } catch (e) {
      const connErr = lang === 'pt' ? "Erro de ligação. Tenta novamente." : "Connection error. Please try again.";
      setMessages(prev => [...prev, { role: "assistant", content: `${connErr} [DEBUG] ${e && e.message ? e.message : String(e)}` }]);
    }
    setLoading(false);
  };

  const handleKey = (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  };

  const visibleMessages = messages.filter(m => !m.hidden);
  const scoreLevel = totalScore > 0 ? L.getScoreLevel(totalScore) : null;
  const isBrasil = L.isBrasilCountry(country);
  const matchedTestimonials = allSelectedKeywords.length > 0
    ? getMatchedTestimonials(allSelectedKeywords)
    : ALL_TESTIMONIALS;

  const ctaConfig = {
    consultPrice: isBrasil ? L.consultPriceBrasil : L.consultPriceEurope,
    links: isBrasil
      ? [{ label: L.iherbBrasil.label, url: "https://www.iherb.com", sub: L.iherbBrasil.sub }]
      : [
          { label: L.newhope.label, url: "https://shop.newhopeglobal.com/product-detail/combo-pack/hope", sub: L.newhope.sub },
          { label: L.iherb.label, url: "https://www.iherb.com", sub: L.iherb.sub },
        ],
  };

  return (
    <>
      {/* Fixed language toggle button */}
      <button
        onClick={() => setLang(l => l === 'pt' ? 'en' : 'pt')}
        style={{
          position: 'fixed',
          top: '10px',
          right: '10px',
          zIndex: 9999,
          background: 'white',
          border: '1px solid #ccc',
          borderRadius: '6px',
          padding: '4px 8px',
          cursor: 'pointer',
          fontSize: '18px',
          boxShadow: '0 2px 8px rgba(0,0,0,0.15)'
        }}
      >
        {lang === 'pt' ? '🇬🇧' : '🇵🇹'}
      </button>

    <div style={{
      minHeight: "100vh", background: BRAND_LIGHT,
      display: "flex", flexDirection: "column",
      fontFamily: "'Segoe UI', system-ui, sans-serif",
      color: BRAND_DARK,
    }}>

      {/* Header */}
      <div style={{
        padding: "14px 20px 12px",
        borderBottom: `1px solid ${BRAND_MID}`,
        background: "#ffffff",
        position: "sticky", top: 0, zIndex: 10, flexShrink: 0,
        boxShadow: "0 1px 12px rgba(137,179,226,0.12)",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
          <img
            src={ROBOT_IMG}
            alt="Assistente"
            style={{
              width: "36px", height: "36px", borderRadius: "50%",
              objectFit: "cover", objectPosition: "center top",
              border: `2px solid ${BRAND}`,
              flexShrink: 0,
            }}
          />
          <div>
            <div style={{ fontSize: "14px", fontWeight: "700", color: BRAND_DARK, lineHeight: 1.2 }}>{L.headerTitle}</div>
            <div style={{ fontSize: "10px", color: BRAND, letterSpacing: "1px", textTransform: "uppercase" }}>{L.headerSub}</div>
          </div>
        </div>
      </div>

      {/* Body */}
      <div style={{
        flex: 1, overflowY: "auto", padding: "24px 16px",
        display: "flex", flexDirection: "column", gap: "14px",
      }}>

        {/* === WELCOME === */}
        {phase === "welcome" && (
          <div style={{
            display: "flex", flexDirection: "column", alignItems: "center",
            justifyContent: "center", flex: 1, textAlign: "center",
            gap: "20px", padding: "16px 20px 32px",
          }}>
            <img
              src={ROBOT_IMG}
              alt="Assistente BIO-OX"
              style={{
                width: "120px", height: "120px", borderRadius: "50%",
                objectFit: "cover", objectPosition: "center top",
                border: `3px solid ${BRAND}`,
                boxShadow: `0 4px 20px rgba(137,179,226,0.35)`,
              }}
            />
            <div>
              <h2 style={{ fontSize: "20px", fontWeight: "700", color: BRAND_DARK, margin: "0 0 8px 0", lineHeight: 1.4 }}>

              <p style={{ fontSize: "13px", color: "#6a8fae", margin: 0, lineHeight: 1.7, maxWidth: "270px" }}>

            <div style={{ width: "100%", maxWidth: "300px", display: "flex", flexDirection: "column", gap: "12px" }}>

                  >

                      fontSize: "12px", color: "#ffffff", fontWeight: "700",

                      {isSelected ? "✓" : ""}

                      e.currentTarget.style.background = BRAND;
                      e.currentTarget.style.color = "#ffffff";
                      e.currentTarget.style.borderColor = BRAND;
                    }}
                    onMouseLeave={e => {
                      e.currentTarget.style.background = BRAND_LIGHT;
                      e.currentTarget.style.color = BRAND_DARK;
                      e.currentTarget.style.borderColor = BRAND_MID;
                    }}
                  >
                    {opt.label}
                  </button>
                ))}
              </div>
            </div>

            <p style={{ fontSize: "11px", color: "#aac4e0", margin: 0, textAlign: "center" }}>
              {L.scoreHint(nameInput)}
            </p>
          </div>
        )}

        {/* === SCORE RESULT === */}
        {phase === "result" && scoreLevel && (
          <div style={{
            display: "flex", flexDirection: "column", alignItems: "center",
            flex: 1, padding: "8px 4px 32px", gap: "18px",
          }}>
            <div style={{ fontSize: "11px", color: "#6a8fae", fontWeight: "600", letterSpacing: "1px", textTransform: "uppercase" }}>
              {L.resultGreeting(nameInput)}
            </div>

            <div style={{
              width: "100%", maxWidth: "340px",
              background: scoreLevel.bgColor,
              border: `2px solid ${scoreLevel.color}30`,
              borderRadius: "20px", padding: "24px 20px",
              boxShadow: `0 4px 24px ${scoreLevel.color}20`,
              display: "flex", flexDirection: "column", alignItems: "center", gap: "16px",
            }}>
              <ScoreBalance
                tilt={scoreLevel.tilt}
                oxidLevel={scoreLevel.oxidLevel}
                antioxLevel={scoreLevel.antioxLevel}
                color={scoreLevel.color}
              />
              <div style={{ textAlign: "center" }}>
                <div style={{
                  fontSize: "42px", fontWeight: "800", color: scoreLevel.color,
                  lineHeight: 1, letterSpacing: "-1px",
                }}>
                  {totalScore}<span style={{ fontSize: "18px", fontWeight: "500", color: "#aac4e0" }}>/40</span>
                </div>
                <div style={{
                  fontSize: "15px", fontWeight: "700", color: scoreLevel.color,
                  marginTop: "6px", letterSpacing: "0.3px",
                }}>
                  {scoreLevel.label}
                </div>
              </div>
              <p style={{
                fontSize: "13px", color: "#5a7a9a", lineHeight: 1.6,
                margin: 0, textAlign: "center", maxWidth: "240px",
              }}>
                {scoreLevel.sublabel}
              </p>
              <div style={{
                display: "flex", alignItems: "center", gap: "6px",
                padding: "6px 14px",
                background: `${BRAND}18`,
                borderRadius: "20px", marginTop: "4px",
              }}>
                <svg width="14" height="14" viewBox="0 0 120 100" fill="none">
                  <polygon points="60,6 100,28 100,72 60,94 20,72 20,28" fill={BRAND} opacity="0.8"/>
                  <path d="M38,50 C38,42 44,38 50,38 C56,38 59,44 60,50 C61,56 64,62 70,62 C76,62 82,58 82,50 C82,42 76,38 70,38 C64,38 61,44 60,50 C59,56 56,62 50,62 C44,62 38,58 38,50 Z" fill="none" stroke="white" strokeWidth="6"/>
                </svg>
                <span style={{ fontSize: "10px", color: BRAND_DARK, fontWeight: "700", letterSpacing: "1px" }}>{lang === "en" ? "BIO-OX PROTOCOL" : "BIO-OX PROTOCOLO"}</span>
              </div>
            </div>

            <p style={{
              fontSize: "11px", color: "#aac4e0", textAlign: "center",
              maxWidth: "300px", lineHeight: 1.6, margin: "0 auto -4px",
            }}>
              {L.scoreDisclaimer}
            </p>

            <div style={{ width: "100%", maxWidth: "340px", display: "flex", flexDirection: "column", gap: "10px" }}>
              <button
                onClick={() => setPhase("testimonials")}
                style={{
                  width: "100%", padding: "15px",
                  background: `linear-gradient(135deg, ${BRAND}, ${BRAND_DARK})`,
                  border: "none", borderRadius: "12px",
                  color: "#ffffff", fontSize: "15px",
                  fontFamily: "inherit", fontWeight: "600",
                  cursor: "pointer",
                  boxShadow: `0 4px 18px rgba(137,179,226,0.4)`,
                  transition: "all 0.2s ease",
                }}
              >
                {L.resultBtn}
              </button>
            </div>
          </div>
        )}

        {/* === TESTIMONIALS === */}
        {phase === "testimonials" && (
          <div style={{
            display: "flex", flexDirection: "column", alignItems: "center",
            flex: 1, padding: "8px 4px 32px", gap: "18px",
          }}>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: "11px", color: "#6a8fae", fontWeight: "600", letterSpacing: "1px", textTransform: "uppercase", marginBottom: "6px" }}>
                {L.testimonialsLabel}
              </div>
              <h3 style={{ fontSize: "17px", fontWeight: "700", color: BRAND_DARK, margin: 0, lineHeight: 1.4 }}>
                {L.testimonialsTitle(complaintsLabel)}
              </h3>
            </div>

            {matchedTestimonials.slice(0, 2).map((t, i) => (
              <div key={i} style={{
                width: "100%", maxWidth: "340px",
                background: "#ffffff",
                border: `1.5px solid ${BRAND_MID}`,
                borderRadius: "16px", padding: "20px",
                boxShadow: "0 2px 14px rgba(137,179,226,0.10)",
                display: "flex", flexDirection: "column", gap: "12px",
              }}>
                <div style={{ fontSize: "32px", color: BRAND, lineHeight: 1, opacity: 0.5, marginBottom: "-8px" }}>"</div>
                <p style={{ fontSize: "13px", color: "#4a6a8a", lineHeight: 1.75, margin: 0 }}>
                  {lang === "en" ? (t.text_en || t.text) : t.text}
                </p>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
                  <div>
                    <div style={{ fontSize: "13px", fontWeight: "700", color: BRAND_DARK }}>{t.name}</div>
                    <div style={{ fontSize: "11px", color: "#8aaccc" }}>{t.location}</div>
                  </div>
                  <div style={{ display: "flex", gap: "4px", flexWrap: "wrap", justifyContent: "flex-end" }}>
                    {(lang === "en" ? (t.tags_en || t.tags) : t.tags).map((tag, j) => (
                      <span key={j} style={{
                        fontSize: "10px", padding: "3px 8px",
                        background: BRAND_LIGHT, color: BRAND_DARK,
                        borderRadius: "20px", fontWeight: "500",
                      }}>{tag}</span>
                    ))}
                  </div>
                </div>
                <div style={{
                  display: "flex", alignItems: "center", gap: "5px",
                  paddingTop: "8px", borderTop: `1px solid ${BRAND_MID}`,
                }}>
                  <svg width="10" height="10" viewBox="0 0 120 100" fill="none">
                    <polygon points="60,6 100,28 100,72 60,94 20,72 20,28" fill={BRAND} opacity="0.7"/>
                  </svg>
                  <span style={{ fontSize: "10px", color: "#8aaccc", fontWeight: "500" }}>{L.testimonialsClientTag}</span>
                </div>
              </div>
            ))}

            <div style={{ width: "100%", maxWidth: "340px" }}>
              <button
                onClick={() => setPhase("country")}
                style={{
                  width: "100%", padding: "15px",
                  background: `linear-gradient(135deg, ${BRAND}, ${BRAND_DARK})`,
                  border: "none", borderRadius: "12px",
                  color: "#ffffff", fontSize: "15px",
                  fontFamily: "inherit", fontWeight: "600",
                  cursor: "pointer",
                  boxShadow: `0 4px 18px rgba(137,179,226,0.4)`,
                }}
              >
                {L.testimonialsBtn}
              </button>
            </div>
          </div>
        )}

        {/* === COUNTRY SELECTION === */}
        {phase === "country" && (
          <div style={{
            display: "flex", flexDirection: "column", alignItems: "center",
            justifyContent: "center", flex: 1, padding: "8px 20px 32px", gap: "20px",
          }}>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: "11px", color: "#6a8fae", fontWeight: "600", letterSpacing: "1px", textTransform: "uppercase", marginBottom: "8px" }}>
                {L.countryLabel}
              </div>
              <h3 style={{ fontSize: "18px", fontWeight: "700", color: BRAND_DARK, margin: "0 0 6px", lineHeight: 1.4 }}>
                {L.countryTitle}
              </h3>
              <p style={{ fontSize: "13px", color: "#6a8fae", margin: 0, lineHeight: 1.6 }}>
                {L.countrySubtitle}
              </p>
            </div>

            <div style={{ width: "100%", maxWidth: "300px", display: "flex", flexDirection: "column", gap: "10px" }}>
              {L.countries.map(c => (
                <button
                  key={c}
                  onClick={() => { setCountry(c); setPhase("cta"); }}
                  style={{
                    width: "100%", padding: "16px",
                    background: "#ffffff",
                    border: `1.5px solid ${BRAND_MID}`,
                    borderRadius: "12px",
                    color: BRAND_DARK, fontSize: "15px",
                    fontFamily: "inherit", fontWeight: "500",
                    cursor: "pointer", transition: "all 0.15s ease",
                    textAlign: "center",
                  }}
                  onMouseEnter={e => {
                    e.currentTarget.style.background = BRAND_LIGHT;
                    e.currentTarget.style.borderColor = BRAND;
                  }}
                  onMouseLeave={e => {
                    e.currentTarget.style.background = "#ffffff";
                    e.currentTarget.style.borderColor = BRAND_MID;
                  }}
                >
                  {L.countryEmojis[c] || c}
                </button>
              ))}
            </div>
          </div>
        )}

        {/* === CTA === */}
        {phase === "cta" && (
          <div style={{
            display: "flex", flexDirection: "column", alignItems: "center",
            flex: 1, padding: "8px 4px 32px", gap: "16px",
          }}>
            <div style={{ textAlign: "center", maxWidth: "300px" }}>
              <div style={{ fontSize: "11px", color: "#6a8fae", fontWeight: "600", letterSpacing: "1px", textTransform: "uppercase", marginBottom: "8px" }}>
                {L.ctaLabel}
              </div>
              <h3 style={{ fontSize: "17px", fontWeight: "700", color: BRAND_DARK, margin: 0, lineHeight: 1.4 }}>
                {L.ctaTitle}
              </h3>
            </div>

            {/* Consultancy card */}
            <div style={{
              width: "100%", maxWidth: "340px",
              background: `linear-gradient(135deg, ${BRAND_DARK}, #0d2a47)`,
              borderRadius: "16px", padding: "22px 20px",
              boxShadow: "0 6px 24px rgba(26,58,92,0.3)",
            }}>
              <div style={{ marginBottom: "12px" }}>
                <div style={{ fontSize: "10px", color: CYAN, fontWeight: "700", letterSpacing: "1.5px", textTransform: "uppercase", marginBottom: "4px" }}>
                  {L.ctaPopular}
                </div>
                <div style={{ fontSize: "17px", fontWeight: "700", color: "#ffffff", lineHeight: 1.3 }}>
                  {L.ctaConsultTitle}
                </div>
              </div>
              <p style={{ fontSize: "13px", color: "#b8d4f0", lineHeight: 1.65, margin: "0 0 16px" }}>
                {L.ctaConsultDesc}
              </p>
              <div style={{ display: "flex", alignItems: "baseline", gap: "6px", marginBottom: "16px" }}>
                <span style={{ fontSize: "28px", fontWeight: "800", color: CYAN }}>{ctaConfig.consultPrice}</span>
                <span style={{ fontSize: "13px", color: "#7aaad0" }}>{L.ctaConsultSession}</span>
              </div>
              <a
                href={HOTMART_LINK}
                target="_blank"
                rel="noopener noreferrer"
                style={{
                  display: "block", width: "100%", padding: "14px",
                  background: CYAN,
                  borderRadius: "10px",
                  color: BRAND_DARK, fontSize: "14px",
                  fontFamily: "inherit", fontWeight: "700",
                  textDecoration: "none", textAlign: "center",
                  boxShadow: `0 4px 14px ${CYAN}50`,
                  boxSizing: "border-box",
                }}
              >
                {L.ctaConsultBtn}
              </a>
              <a
                href={`https://wa.me/351918977205?text=${L.waMsg(nameInput.trim(), complaintsLabelLang || (lang === "en" ? "not specified" : "não especificado"), totalScore)}`}
                target="_blank"
                rel="noopener noreferrer"
                onClick={() => saveLead({
                  session_id: sessionId,
                  stage: "whatsapp_click",
                  name: nameInput.trim(),
                  email: emailInput.trim(),
                  score: totalScore,
                  lang: lang,
                })}
                style={{
                  display: "flex", alignItems: "center", justifyContent: "center", gap: "8px",
                  width: "100%", padding: "13px",
                  background: "#25D366",
                  borderRadius: "10px",
                  color: "#ffffff", fontSize: "14px",
                  fontFamily: "inherit", fontWeight: "700",
                  textDecoration: "none", textAlign: "center",
                  marginTop: "10px",
                  boxSizing: "border-box",
                  boxShadow: "0 4px 14px rgba(37,211,102,0.4)",
                }}
              >
                {L.waBtn}
              </a>
              <div style={{ textAlign: "center", marginTop: "4px" }}>
                <span style={{ fontSize: "11px", color: "#7aaad0" }}>
                  {L.waSubBtn}
                </span>
              </div>
            </div>

            {/* Supplements card */}
            <div style={{
              width: "100%", maxWidth: "340px",
              background: "#ffffff",
              border: `1.5px solid ${BRAND_MID}`,
              borderRadius: "16px", padding: "22px 20px",
              boxShadow: "0 2px 14px rgba(137,179,226,0.10)",
              display: "flex", flexDirection: "column", gap: "12px",
            }}>
              <div>
                <div style={{ fontSize: "17px", fontWeight: "700", color: BRAND_DARK, marginBottom: "6px" }}>
                  {L.ctaSupTitle}
                </div>
                <p style={{ fontSize: "13px", color: "#5a7a9a", lineHeight: 1.65, margin: 0 }}>
                  {L.ctaSupDesc}
                </p>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                {ctaConfig.links.map((link, i) => (
                  <a
                    key={i}
                    href={link.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    style={{
                      display: "block", padding: "13px 16px",
                      background: BRAND_LIGHT,
                      border: `1.5px solid ${BRAND_MID}`,
                      borderRadius: "10px",
                      color: BRAND_DARK, fontSize: "13px",
                      fontFamily: "inherit", fontWeight: "600",
                      textDecoration: "none",
                      boxSizing: "border-box",
                    }}
                  >
                    <div>{link.label}</div>
                    <div style={{ fontSize: "11px", color: "#8aaccc", fontWeight: "400", marginTop: "2px" }}>{link.sub}</div>
                  </a>
                ))}
              </div>
            </div>

            {/* Talk to assistant option */}
            <div style={{ width: "100%", maxWidth: "340px" }}>
              <button
                onClick={() => messages.length > 0 ? setPhase("chat") : startChat()}
                style={{
                  width: "100%", padding: "13px",
                  background: "transparent",
                  border: `1.5px solid ${BRAND_MID}`,
                  borderRadius: "12px",
                  color: BRAND, fontSize: "14px",
                  fontFamily: "inherit", fontWeight: "500",
                  cursor: "pointer",
                }}
              >
                {messages.length > 0 ? L.chatBtnResume : L.chatBtn}
              </button>
            </div>
            <p style={{ fontSize: "11px", color: "#aac4e0", margin: 0, textAlign: "center", maxWidth: "280px", lineHeight: 1.5 }}>
              {L.ctaDisclaimer}
            </p>
          </div>
        )}

        {/* === CHAT === */}
        {phase === "chat" && (
          <>
            {visibleMessages.map((msg, i) => (
              <div key={i} style={{ display: "flex", justifyContent: msg.role === "user" ? "flex-end" : "flex-start", alignItems: "flex-end", gap: "8px" }}>
                {msg.role === "assistant" && (
                  <img
                    src={ROBOT_IMG}
                    alt=""
                    style={{
                      width: "28px", height: "28px", borderRadius: "50%",
                      objectFit: "cover", objectPosition: "center top",
                      border: `1.5px solid ${BRAND}`,
                      flexShrink: 0,
                    }}
                  />
                )}
                <div style={{
                  maxWidth: "78%", padding: "11px 15px",
                  borderRadius: msg.role === "user" ? "18px 18px 4px 18px" : "18px 18px 18px 4px",
                  background: msg.role === "user" ? `linear-gradient(135deg, ${BRAND}, ${BRAND_DARK})` : "#ffffff",
                  border: msg.role === "assistant" ? `1px solid ${BRAND_MID}` : "none",
                  boxShadow: msg.role === "assistant" ? "0 1px 6px rgba(137,179,226,0.12)" : "none",
                  fontSize: "14px", lineHeight: "1.75",
                  color: msg.role === "user" ? "#ffffff" : BRAND_DARK,
                  whiteSpace: "pre-wrap",
                }}>
                  {msg.content}
                </div>
              </div>
            ))}

            {loading && (
              <div style={{ display: "flex", justifyContent: "flex-start" }}>
                <div style={{
                  padding: "12px 18px", borderRadius: "18px 18px 18px 4px",
                  background: "#ffffff", border: `1px solid ${BRAND_MID}`,
                  display: "flex", gap: "5px", alignItems: "center",
                  boxShadow: "0 1px 6px rgba(137,179,226,0.12)",
                }}>
                  {[0,1,2].map(i => (
                    <div key={i} style={{
                      width: "6px", height: "6px", borderRadius: "50%", background: BRAND,
                      animation: "pulse 1.2s ease-in-out infinite",
                      animationDelay: `${i * 0.2}s`,
                    }} />
                  ))}
                </div>
              </div>
            )}
            <div ref={bottomRef} />
          </>
        )}
      </div>

      {/* Input */}
      {phase === "chat" && (
        <div style={{
          padding: "10px 16px 18px",
          borderTop: `1px solid ${BRAND_MID}`,
          background: "#ffffff", flexShrink: 0,
          boxShadow: "0 -1px 12px rgba(137,179,226,0.08)",
        }}>
          <button
            onClick={() => setPhase("cta")}
            style={{
              width: "100%", padding: "11px", marginBottom: "10px",
              background: `linear-gradient(135deg, ${BRAND}, ${BRAND_DARK})`,
              border: "none", borderRadius: "10px",
              color: "#ffffff", fontSize: "13px",
              fontFamily: "inherit", fontWeight: "600",
              cursor: "pointer", letterSpacing: "0.2px",
            }}
          >
            {L.ctaBackBtn}
          </button>
          <div style={{
            display: "flex", gap: "10px", alignItems: "flex-end",
            background: BRAND_LIGHT, border: `1.5px solid ${BRAND_MID}`,
            borderRadius: "24px", padding: "8px 8px 8px 16px",
          }}>
            <textarea
              ref={inputRef}
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={handleKey}
              placeholder={L.chatPlaceholder}
              disabled={loading}
              rows={1}
              style={{
                flex: 1, background: "transparent", border: "none",
                outline: "none", color: BRAND_DARK, fontSize: "14px",
                fontFamily: "inherit", resize: "none", lineHeight: "1.5",
                maxHeight: "100px", overflowY: "auto", padding: "4px 0",
              }}
            />
            <button
              onClick={sendMessage}
              disabled={loading || !input.trim()}
              style={{
                width: "36px", height: "36px", borderRadius: "50%",
                background: input.trim() && !loading ? `linear-gradient(135deg, ${BRAND}, ${BRAND_DARK})` : BRAND_MID,
                border: "none",
                cursor: input.trim() && !loading ? "pointer" : "default",
                display: "flex", alignItems: "center", justifyContent: "center",
                color: input.trim() && !loading ? "#ffffff" : "#aac4e0",
                fontSize: "17px", fontWeight: "bold", flexShrink: 0,
                transition: "all 0.2s ease",
              }}
            >↑</button>
          </div>
          <p style={{ textAlign: "center", fontSize: "10px", color: "#aac4e0", margin: "8px 0 0" }}>
            {L.chatDisclaimer}
          </p>
        </div>
      )}

      <style>{`
        @keyframes pulse {
          0%, 100% { opacity: 0.3; transform: scale(0.8); }
          50% { opacity: 1; transform: scale(1); }
        }
        textarea::placeholder { color: #aac4e0; }
        input::placeholder { color: #aac4e0; }
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: ${BRAND_MID}; border-radius: 2px; }
      `}</style>
    </div>
    </>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(CoachIA));
</script>

</body></html>
